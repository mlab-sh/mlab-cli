name: CI

# The same three checks the release workflow gates on, run on every push and
# pull request so a branch that could not be released fails here first rather
# than at the moment someone clicks Release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting and lints are platform-independent, so they run once rather
      # than on both runners.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      # The integration suite binds an ephemeral loopback port per test and
      # points the CLI at a throwaway $HOME, so it needs no credentials and
      # never touches the network.
      - name: Test
        run: cargo test --all --locked

  # The pre-commit hook, installed the way a user gets it: pre-commit builds
  # this checkout with `cargo install --path .` and runs it on a lockfile.
  # Unlike the suite above this job reaches vuln.mlab.sh, because what it
  # proves is that the hook, the binary and the live API agree. The lockfiles
  # are written here rather than committed, so a deliberately vulnerable
  # fixture never shows up in this repository's Dependabot alerts.
  pre-commit-hook:
    name: pre-commit hook
    runs-on: ubuntu-latest
    env:
      MLAB_VULN_TOKEN: ${{ secrets.MLAB_VULN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Validate the manifest
        run: pre-commit validate-manifest .pre-commit-hooks.yaml

      - name: Blocks a vulnerable lockfile
        run: |
          dir=$(mktemp -d) && cd "$dir" && git init -q
          printf '{"name":"fixture","lockfileVersion":3,"requires":true,"packages":{"":{"name":"fixture","dependencies":{"lodash":"4.17.20"}},"node_modules/lodash":{"version":"4.17.20"}}}' > package-lock.json
          git add package-lock.json
          if pre-commit try-repo "$GITHUB_WORKSPACE" mlab-sbom-scan --files package-lock.json; then
            echo "::error::the hook let lodash 4.17.20 through"
            exit 1
          fi

      - name: Passes a clean lockfile
        run: |
          sleep 5
          dir=$(mktemp -d) && cd "$dir" && git init -q
          printf '{"name":"fixture","lockfileVersion":3,"requires":true,"packages":{"":{"name":"fixture","dependencies":{"ms":"2.1.3"}},"node_modules/ms":{"version":"2.1.3"}}}' > package-lock.json
          git add package-lock.json
          pre-commit try-repo "$GITHUB_WORKSPACE" mlab-sbom-scan --files package-lock.json
